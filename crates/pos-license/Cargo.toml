[package]
name = "pos-license"
description = "DZBuild POS licences: this PC's device code, Ed25519-signed keys verified offline, the three licence stores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
pos-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tracing.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
# This PC's identity: the registry (MachineGuid, the processor, ProductId), the system volume's
# serial number, the SMBIOS system UUID (GetSystemFirmwareTable) and the system disk's serial
# number (CreateFileW + DeviceIoControl; CreateFileW needs Win32_Security). The same versions as
# Cargo.lock already holds.
windows-registry = "0.6.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemInformation",
] }

[features]
# The test signing key and the test device, for the shell's tests (src-tauri dev-dependencies).
testkit = []

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
