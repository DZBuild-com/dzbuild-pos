[package]
name = "pos-docs"
description = "DZBuild POS documents: receipt/invoice models, amount in letters, xlsx/csv import-export, document locales."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
qrcode = { version = "0.14.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
pos-core.workspace = true
rust_xlsxwriter = "0.99.1"
csv = "1.4.0"
calamine = { version = "0.36.1", default-features = false }
encoding_rs = "0.8.42"
chardetng = "1.0.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true

[dev-dependencies]
pos-core = { workspace = true, features = ["testkit"] }
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
