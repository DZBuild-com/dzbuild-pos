[package]
name = "dzbuild-pos"
description = "DZBuild POS: free, offline-first point of sale for Algerian shops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "dzbuild_pos_lib"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
pos-core.workspace = true
pos-docs.workspace = true
pos-hw.workspace = true
# The shop's network (`lan`): the main PC's server, the till's engine, mDNS. The till's token goes
# through pos-core's Credential Manager store (M7), so no keyring crate is needed here.
pos-server.workspace = true
# M9: this PC's licence (`license.rs`), checked offline.
pos-license.workspace = true
# Logos as `data:` URLs: printed documents' logo inside the print job (`commands::print`) and
# the shop logo for the customer screen (`commands::devices::display_shop`). Same major as pos-hw.
base64 = "0.23.1"
# The print queue (`printing.rs`): receipts print on their own thread after the sale commits.
crossbeam-channel.workspace = true
# `tray-icon`: the system tray (`tray.rs`).
tauri = { version = "2.12.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-fs = "2.6.0"
# Signed updates (spec §13, `updates.rs`): Windows' own TLS (schannel) and its proxy settings.
tauri-plugin-updater = { version = "2.13.0", default-features = false, features = ["native-tls", "system-proxy"] }
# A till checks the setup its main PC mirrors as the plugin checks a download (the
# plugin's own minisign verifier and the semver of its versions; both already in the lockfile).
minisign-verify = "0.2.5"
semver = "1.0.28"
# The update endpoint (`updates.rs`); in the tests, the DZBuild stand-in's authorize redirect
# (`commands::cloud_mock`).
url.workspace = true
# Tauri's own runtime; `watch` lets commands wait for the database opened after `setup`;
# `time` paces the update checker (`updates::spawn_checker`); `macros` watches a download
# that stalls (`updates::UpdateService::download`).
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { workspace = true, features = ["serde_json"] }
specta-typescript = "0.0.12"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
# The fiscal archive's `summary.pdf` is written by WebView2 into a temporary folder first.
tempfile.workspace = true
# The DZBuild link's public client values, bundled as `dzbuild.toml` (`cloud::bundled_config`).
toml.workspace = true
# Removable drives and free space (`disks.rs`): the second copy, USB sticks, the fatal screen.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

# The one native message box shown when Tauri cannot start at all (`lib.rs`); the dialog
# plugin already builds rfd with these features.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
# `webview.rs`: switches WebView2's browser accelerator keys off (the till's F-key map needs
# them); the same versions Tauri's own WebView2 runtime uses.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[dev-dependencies]
# The test signing key and device (`license_tests.rs`, `commands::license_tests`).
pos-license = { workspace = true, features = ["testkit"] }
# Test photos for `products_pick_image` (`commands::m2_tests`); pos-docs does the real work.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
insta.workspace = true
# The DZBuild link's tests: a DZBuild stand-in and a browser following the loopback redirect.
wiremock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
reqwest = { workspace = true, features = ["blocking"] }
# The fake update manifests' digests (`commands::updates_tests`).
sha2.workspace = true
hex.workspace = true
# Reads back the diagnostic zip (`commands::diagnostics_tests`); pos-docs writes it.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
