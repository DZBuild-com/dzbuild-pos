name: Bug report
description: Something in DZBuild POS does not work as it should.
title: "[Bug]: "
labels: ["bug", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Arabic, French and English are all welcome.
        **Security problem?** Do not file it here: follow [SECURITY.md](https://github.com/DZBuild-com/dzbuild-pos/blob/main/SECURITY.md).
        **Never paste real customer data, PINs, your database or backups.**
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10, 64-bit
        - Windows 10, 32-bit
        - Other
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: How is this PC set up?
      options:
        - A single PC
        - The main PC with tills on the network
        - A till joined to a main PC
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - العربية (Arabic)
        - Français
        - English
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the till
        2. Scan …
        3. Press …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages and screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines (optional)
      description: From Settings › Diagnostic. Check that nothing private is left before you paste.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed customer data, PINs and shop identifiers from this report.
          required: true
