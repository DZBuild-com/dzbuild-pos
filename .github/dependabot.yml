# Dependabot opens pull requests only for security advisories. Routine version updates are
# turned off (open-pull-requests-limit: 0): the maintainers update dependencies in batches
# and run the checks once, instead of one build per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Algiers
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Algiers
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Algiers
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]
