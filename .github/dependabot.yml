# Weekly dependency updates. Minor and patch updates of one ecosystem come as one grouped pull
# request; a major update comes alone, so its breaking changes get their own review.
# Security updates (Dependabot alerts) are opened as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Algiers
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Algiers
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Algiers
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
