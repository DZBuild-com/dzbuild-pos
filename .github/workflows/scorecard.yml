# OpenSSF Scorecard: the repository's security practices, published to the Security tab and to
# the public scorecard API (the README badge). It only runs once the repository is public.
# Scorecard checks this file before it publishes: keep it to this one job, `uses:` steps from its
# allow-list, read-only top-level permissions and no top-level env or defaults.
name: Scorecard

on:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
