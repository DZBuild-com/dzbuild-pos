# TruffleHog: no live credential in the files or anywhere in the git history. Only verified
# secrets (a key the provider confirms as active) fail the run, so test fixtures stay quiet.
name: Secret scan

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the trufflesecurity/trufflehog tag below (Dependabot bumps the tag).
  TRUFFLEHOG_VERSION: 3.99.2

jobs:
  history:
    name: Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request: its commits; a push: the pushed commits; the weekly run and a manual
      # run: every commit of the repository.
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          version: ${{ env.TRUFFLEHOG_VERSION }}
          extra_args: --only-verified

  files:
    name: Working tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: TruffleHog filesystem scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          "ghcr.io/trufflesecurity/trufflehog:$TRUFFLEHOG_VERSION"
          filesystem /repo --only-verified --fail --no-update --github-actions
